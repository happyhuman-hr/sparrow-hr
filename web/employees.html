<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แฟ้มพนักงาน — The Sparrow HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;600;700&family=EB+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/sparrow-mark-wine.png">
<meta name="theme-color" content="#7a1c2b">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
/* แฟ้มประวัติพนักงาน: HR/เจ้าของ แก้ไขได้ทั้งหมด (รวมข้อมูลอ่อนไหว) · หัวหน้าดูได้เฉพาะลูกทีม ไม่เห็นค่าจ้างและข้อมูลอ่อนไหว */
App.boot({ page: 'employees', role: 'manager', ready: function (me) {
  var main = App.$('#main'), wrap = App.h('<div class="wrap"></div>'); main.appendChild(wrap);
  var data = null, q = '', fStatus = 'active';

  var STATUS = { probation: 'ทดลองงาน', permanent: 'ประจำ', temporary: 'ชั่วคราว', resigned: 'พ้นสภาพ' };
  var PAY = { monthly: 'รายเดือน', daily: 'รายวัน' };
  var ROLE = { employee: 'พนักงาน', manager: 'หัวหน้างาน', hr: 'HR', owner: 'เจ้าของร้าน' };
  var CRIM = { pending: 'รอผล', clear: 'ไม่พบประวัติ', found: 'พบประวัติ' };
  var F = {
    personal: [
      ['prefix', 'คำนำหน้า', 'select', ['นาย', 'นาง', 'นางสาว', 'Mr.', 'Ms.', 'Mrs.']], ['firstName', 'ชื่อ *'], ['lastName', 'นามสกุล'], ['nickname', 'ชื่อเล่น'],
      ['gender', 'เพศ', 'select', ['ชาย', 'หญิง', 'อื่น ๆ']], ['birthDate', 'วันเดือนปีเกิด', 'date'],
      ['ethnicity', 'เชื้อชาติ'], ['nationality', 'สัญชาติ'], ['religion', 'ศาสนา', 'select', ['พุทธ', 'คริสต์', 'อิสลาม', 'ฮินดู', 'ซิกข์', 'ไม่นับถือศาสนา', 'อื่น ๆ']],
      ['maritalStatus', 'สถานภาพสมรส', 'select', ['โสด', 'สมรส', 'หย่าร้าง', 'หม้าย', 'แยกกันอยู่']],
      ['militaryStatus', 'สถานภาพเกณฑ์ทหาร', 'select', ['ผ่านการเกณฑ์ทหารแล้ว', 'ได้รับการยกเว้น', 'เรียน รด. ครบ', 'ยังไม่ผ่านการเกณฑ์', 'ไม่เกี่ยวข้อง']],
      ['bloodType', 'หมู่เลือด', 'select', ['A', 'B', 'O', 'AB', 'ไม่ทราบ']], ['weightKg', 'น้ำหนัก (กก.)', 'number'], ['heightCm', 'ส่วนสูง (ซม.)', 'number'],
      ['phone', 'โทรศัพท์', 'tel'], ['email', 'อีเมล', 'email'], ['address', 'ที่อยู่ปัจจุบัน', 'textarea'], ['emergencyContact', 'ผู้ติดต่อกรณีฉุกเฉิน (ชื่อ / ความสัมพันธ์ / เบอร์)']
    ],
    job: [
      ['department', 'แผนก', 'select', ['ครัว (BOH)', 'หน้าร้าน (FOH)', 'แม่บ้าน', 'บริหาร', 'HR', 'อื่น ๆ']], ['position', 'ตำแหน่ง', 'position'],
      ['startDate', 'วันเริ่มงาน *', 'date'], ['probationEnd', 'วันครบทดลองงาน', 'date'], ['status', 'สถานะการจ้าง', 'map', STATUS], ['payType', 'ประเภทการจ้าง', 'map', PAY],
      ['wage', 'ค่าจ้าง (บาท/เดือน หรือ บาท/วัน)', 'number'], ['supervisorId', 'ผู้บังคับบัญชา', 'sup'],
      ['defaultShift', 'กะประจำ', 'shift'], ['offDays', 'วันหยุดประจำสัปดาห์', 'days'], ['halfDayOn', 'วันทำงานครึ่งวัน (กะ H 15:00–22:00)', 'map', { '1': 'จันทร์', '2': 'อังคาร', '3': 'พุธ', '4': 'พฤหัสบดี', '5': 'ศุกร์', '6': 'เสาร์', '0': 'อาทิตย์' }], ['role', 'สิทธิ์ในระบบ', 'map', ROLE], ['approveScope', 'หัวหน้างานอนุมัติได้', 'scope'], ['endDate', 'วันพ้นสภาพ', 'date'], ['note', 'หมายเหตุ', 'textarea']
    ],
    pay: [
      ['positionAllowance', 'ค่าตำแหน่ง (บาท/เดือน)', 'number'], ['fixedAllowance', 'ค่าโทรศัพท์/เดินทางประจำ (บาท/เดือน)', 'number'],
      ['pvdPercent', 'กองทุนสำรองเลี้ยงชีพ (% ของเงินเดือน)', 'number'], ['bankName', 'ธนาคารรับเงินเดือน', 'select', ['กสิกรไทย', 'ไทยพาณิชย์', 'กรุงเทพ', 'กรุงไทย', 'กรุงศรีอยุธยา', 'ทหารไทยธนชาต', 'ออมสิน', 'อื่น ๆ']],
      ['scPoints', 'ได้รับส่วนแบ่ง Service charge / ทิป', 'sc']
    ],
    sensitive: [
      ['nationalId', 'เลขบัตรประชาชน (13 หลัก)'], ['passportNo', 'เลขที่หนังสือเดินทาง'], ['criminalCheck', 'ผลตรวจประวัติอาชญากรรม', 'map', CRIM],
      ['criminalCheckDate', 'วันที่ตรวจ', 'date'], ['criminalNote', 'รายละเอียด (ถ้ามี)', 'textarea'], ['docUrl', 'ลิงก์เอกสาร (Google Drive)', 'url'], ['bankAccount', 'เลขที่บัญชีธนาคาร']
    ]
  };

  function load() { App.loading(wrap); App.call('employees').then(function (d) { data = d; render(); }).catch(function () {}); }

  function render() {
    var list = data.list.filter(function (e) {
      if (fStatus === 'active' && e.status === 'resigned') return false;
      if (fStatus !== 'active' && fStatus !== 'all' && e.status !== fStatus) return false;
      return !q || (e.name + ' ' + e.id + ' ' + (e.position || '') + ' ' + (e.department || '')).toLowerCase().indexOf(q.toLowerCase()) >= 0;
    });
    wrap.innerHTML = '<div class="row" style="margin-bottom:12px"><div><h1>แฟ้มพนักงาน</h1><div class="sub">' + list.length + ' คน</div></div><div class="spacer"></div>' +
      (data.canEdit ? '<button class="accent" id="add">+ เพิ่มพนักงาน</button>' : '') + '</div>' +
      '<div class="row" style="margin-bottom:12px"><input id="q" placeholder="ค้นหาชื่อ รหัส ตำแหน่ง" value="' + App.esc(q) + '" style="flex:1;min-width:180px">' +
      '<select id="fs" style="width:auto"><option value="active">ยังทำงานอยู่</option><option value="probation">ทดลองงาน</option><option value="permanent">ประจำ</option><option value="temporary">ชั่วคราว</option><option value="resigned">พ้นสภาพ</option><option value="all">ทั้งหมด</option></select></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ตำแหน่ง / แผนก</th><th>สถานะ</th><th>ประเภท</th><th>วันเริ่มงาน</th><th>อายุงาน</th><th>กะประจำ</th></tr></thead><tbody>' +
      (list.length ? list.map(function (e) {
        return '<tr class="click" data-id="' + e.id + '"><td>' + e.id + '</td><td><b>' + App.esc(e.name) + '</b></td><td>' + App.esc(e.position || '-') + '<div class="sub">' + App.esc(e.department || '') + '</div></td>' +
          '<td><span class="badge ' + (e.status === 'probation' ? 'b-late' : e.status === 'resigned' ? 'b-off' : 'b-present') + '">' + (STATUS[e.status] || e.status || '-') + '</span></td>' +
          '<td>' + (PAY[e.payType] || '-') + '</td><td>' + App.dateTH(e.startDate) + '</td><td>' + (e.tenure ? e.tenure.text : '-') + '</td>' +
          '<td>' + shiftText(e) + '</td></tr>';
      }).join('') : '<tr><td colspan="8" class="empty">ไม่พบพนักงาน</td></tr>') + '</tbody></table></div>';
    App.$('#fs').value = fStatus;
    App.$('#q').oninput = function () { q = this.value; var pos = this.selectionStart; render(); var el = App.$('#q'); el.focus(); el.setSelectionRange(pos, pos); };
    App.$('#fs').onchange = function () { fStatus = this.value; render(); };
    if (App.$('#add')) App.$('#add').onclick = function () { open(null); };
    App.$$('tr[data-id]', wrap).forEach(function (tr) { tr.onclick = function () { open(tr.getAttribute('data-id')); }; });
  }

  /** ตำแหน่งงานของร้าน (จากรายชื่อพนักงาน The Sparrow) แยกตามแผนก · เลือกตำแหน่งแล้วเติมแผนกให้อัตโนมัติ */
  var POSITIONS = {
    'บริหาร': ['ผู้จัดการทั่วไป'],
    'HR': ['HR', 'HR outsource (Happy Human)'],
    'ครัว (BOH)': ['Executive Chef', 'Demi Chef', 'Hot Kitchen Commis', 'Cold Kitchen Commis'],
    'หน้าร้าน (FOH)': ['Restaurant Manager', 'FOH staff'],
    'แม่บ้าน': ['แม่บ้าน']
  };
  function deptOfPosition(p) { for (var d in POSITIONS) if (POSITIONS[d].indexOf(p) >= 0) return d; return ''; }
  function input(f, val, ro) {
    var k = f[0], type = f[2] || 'text', v = val === undefined || val === null ? '' : val, dis = ro ? ' disabled' : '';
    var lab = '<label for="f_' + k + '">' + f[1] + '</label>';
    if (type === 'select') return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '><option value=""></option>' + f[3].map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + (v && f[3].indexOf(v) < 0 ? '<option selected>' + App.esc(v) + '</option>' : '') + '</select>';
    if (type === 'map') return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '><option value=""></option>' + Object.keys(f[3]).map(function (o) { return '<option value="' + o + '"' + (o === v ? ' selected' : '') + '>' + f[3][o] + '</option>'; }).join('') + '</select>';
    if (type === 'position') {
      var known = !!deptOfPosition(v);
      return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + ' onchange="var dep=document.getElementById(\'f_department\'),o=this.selectedOptions[0],g=o&&o.parentNode.label;if(dep&&g&&[].some.call(dep.options,function(x){return x.value===g}))dep.value=g;"><option value=""></option>' +
        Object.keys(POSITIONS).map(function (d) { return '<optgroup label="' + d + '">' + POSITIONS[d].map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</optgroup>'; }).join('') +
        (v && !known ? '<optgroup label="ตำแหน่งเดิม (ไม่อยู่ในรายการ)"><option selected>' + App.esc(v) + '</option></optgroup>' : '') + '</select>';
    }
    if (type === 'scope') {
      var cur = String(v || '').toLowerCase(), opts = [['', 'ใบลาและ OT'], ['ot', 'OT อย่างเดียว'], ['leave', 'ใบลาอย่างเดียว']];
      return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '>' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        '<div class="sub">ใช้กับสิทธิ์ หัวหน้างาน เท่านั้น · อนุมัติเฉพาะลูกทีม (คนที่ใส่ชื่อนี้เป็นผู้บังคับบัญชา) · เรื่องที่อนุมัติไม่ได้จะไปรอเจ้าของร้าน / HR</div>';
    }
    if (type === 'sc') { var no = String(v) === '0'; return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '><option value=""' + (no ? '' : ' selected') + '>ได้รับ (ตามจำนวนวันที่มาทำงาน)</option><option value="0"' + (no ? ' selected' : '') + '>ไม่ได้รับ</option></select>'; }
    if (type === 'shift') return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '><option value="">— ไม่กำหนด —</option>' + (data.shifts || []).map(function (s) { return '<option value="' + s.code + '"' + (s.code === v ? ' selected' : '') + '>' + s.code + ' · ' + s.start + '–' + s.end + '</option>'; }).join('') + '</select><div class="sub">ใช้เป็นค่าเริ่มต้นในตารางกะ แก้รายวันได้ที่หน้าตารางกะ</div>';
    if (type === 'days') return lab + daysPicker(k, v, ro);
    if (type === 'sup') return lab + '<select id="f_' + k + '" data-k="' + k + '"' + dis + '><option value="">-</option>' + data.list.filter(function (e) { return e.status !== 'resigned'; }).map(function (e) { return '<option value="' + e.id + '"' + (e.id === v ? ' selected' : '') + '>' + App.esc(e.name) + '</option>'; }).join('') + '</select>';
    if (type === 'textarea') return lab + '<textarea id="f_' + k + '" data-k="' + k + '"' + dis + '>' + App.esc(v) + '</textarea>';
    return lab + '<input id="f_' + k + '" data-k="' + k + '" type="' + type + '" value="' + App.esc(v) + '"' + dis + '>';
  }
  var DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  /** เลือกวันหยุดประจำสัปดาห์ (เก็บเป็น "1,3" — 0=อาทิตย์) */
  function daysPicker(k, v, ro) {
    var on = String(v || '').split(',');
    return '<div class="seg days" data-days="' + k + '">' + [1, 2, 3, 4, 5, 6, 0].map(function (d) {
      return '<button type="button" data-d="' + d + '" class="' + (on.indexOf(String(d)) >= 0 ? 'on' : '') + '"' + (ro ? ' disabled' : '') + '>' + DOW[d] + '</button>';
    }).join('') + '</div><input type="hidden" data-k="' + k + '" value="' + App.esc(v || '') + '"><div class="sub">ข้อบังคับฯ: ครัว/ต้อนรับ ทำงาน 5 วัน หยุดจันทร์ + อีก 1 วัน (อังคาร–พฤหัสบดี) · แม่บ้าน 5.5 วัน หยุดจันทร์ + ทำงานครึ่งวัน 1 วัน</div>';
  }
  function shiftText(e) {
    if (!e.defaultShift && !e.offDays) return '<span class="sub">-</span>';
    var off = String(e.offDays || '').split(',').filter(Boolean).map(function (d) { return DOW[+d]; }).join(', ');
    var half = e.halfDayOn !== undefined && e.halfDayOn !== '' ? ' <span class="sub">· ครึ่งวัน' + DOW[+e.halfDayOn] + '</span>' : '';
    return (e.defaultShift ? '<b>' + e.defaultShift + '</b>' : '') + (off ? ' <span class="sub">หยุด ' + off + '</span>' : '') + half;
  }
  /** ช่องเงินเดือนเฉพาะรายการที่ร้านเปิดใช้ (หน้าตั้งค่า → เงินเดือน) */
  function payFields() {
    var on = data.payItems || {}, need = { positionAllowance: 'usePositionAllowance', fixedAllowance: 'useFixedAllowance', pvdPercent: 'usePvd' };
    return F.pay.filter(function (f) { return !need[f[0]] || on[need[f[0]]]; });
  }
  function fields(list, obj, ro) { return '<div class="grid g3">' + list.map(function (f) { return '<div class="field"' + (f[2] === 'textarea' ? ' style="grid-column:1/-1"' : '') + '>' + input(f, obj[f[0]], ro) + '</div>'; }).join('') + '</div>'; }

  function open(id) {
    var p = id ? App.call('employeeGet', { id: id }) : Promise.resolve({ status: 'probation', payType: 'monthly', role: 'employee', nationality: 'ไทย', ethnicity: 'ไทย', sensitive: {} });
    p.then(function (e) {
      var ro = !data.canEdit;
      var m = App.modal(id ? e.name : 'เพิ่มพนักงานใหม่',
        (id ? '<div class="row" style="margin-bottom:12px"><span class="badge">' + e.id + '</span><span class="sub">อายุงาน ' + (e.tenure ? e.tenure.text : '-') + '</span><div class="spacer"></div>' +
          '<a class="btn sm" href="' + App.link('my.html') + (App.link('my.html').indexOf('?') > 0 ? '&' : '?') + 'emp=' + e.id + '">ปฏิทิน / เวลาทำงาน</a></div>' : '') +
        '<fieldset><legend>1. ข้อมูลส่วนตัว</legend>' + fields(F.personal, e, ro) + '</fieldset>' +
        '<fieldset><legend>2. การจ้างงาน</legend>' + fields(F.job.filter(function (f) { return data.canEdit || (f[0] !== 'wage' && f[0] !== 'role' && f[0] !== 'approveScope'); }), e, ro) + '</fieldset>' +
        (data.canEdit ? '<fieldset><legend>3. เงินเดือนและภาษี</legend><p class="sub" style="margin-top:0">ใช้ในรายงานเงินเดือน: Service charge / ทิป แบ่งตามจำนวนวันที่มาทำงานจริง (เลือก "ไม่ได้รับ" สำหรับคนที่ไม่ร่วมรับ เช่น เจ้าของร้าน)</p>' + fields(payFields(), e, ro) + '</fieldset>' : '') +
        (data.canSensitive ? '<fieldset class="sens"><legend>4. ข้อมูลอ่อนไหว (เห็นเฉพาะ HR / เจ้าของร้าน)</legend><p class="sub" style="margin-top:0">เก็บตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล โดยได้รับความยินยอมจากพนักงาน (แบบ HR-F-03)</p>' +
          '<div id="sens">' + fields(F.sensitive, e.sensitive || {}, ro) + '</div></fieldset>' : '') +
        (id && data.canEdit ? '<fieldset><legend>รหัสเข้าใช้งานครั้งแรก</legend><div class="row">' + (e.bindCode ? '<b style="font-size:20px;letter-spacing:.15em">' + e.bindCode + '</b>' : '<span class="sub">ใช้รหัสไปแล้ว</span>') +
          '<div class="spacer"></div><button class="sm" id="newcode">ออกรหัสใหม่</button></div><p class="sub">ให้พนักงานกรอกรหัสนี้ครั้งแรกที่เปิดระบบ (ใช้ได้ครั้งเดียว)</p></fieldset>' : '') +
        (data.canEdit ? '<div class="row"><div class="spacer"></div><button class="accent" id="save">บันทึก</button></div>' : ''));
      App.$$('[data-days] button', m.el).forEach(function (b) { b.onclick = function () {
        b.classList.toggle('on');
        var box = b.parentNode, on = App.$$('button.on', box).map(function (x) { return x.getAttribute('data-d'); });
        box.nextElementSibling.value = on.join(',');
      }; });
      if (App.$('#newcode', m.el)) App.$('#newcode', m.el).onclick = function () {
        if (!e.bindCode && !confirm('ออกรหัสใหม่? พนักงานต้องกรอกรหัสใหม่อีกครั้งจึงจะเข้าใช้งานได้ (ใช้เมื่อเปลี่ยนโทรศัพท์หรือบัญชี)')) return;
        App.call('employeeNewCode', { id: e.id, unbind: true }).then(function (r) { App.toast('รหัสใหม่: ' + r.code); m.close(); load(); }).catch(function () {});
      };
      if (App.$('#save', m.el)) App.$('#save', m.el).onclick = function () {
        var d = {}, s = {};
        App.$$('[data-k]', m.el).forEach(function (el) { (el.closest('#sens') ? s : d)[el.getAttribute('data-k')] = el.value.trim(); });
        this.disabled = true; var btn = this;
        App.call('employeeSave', { id: id, data: d, sensitive: data.canSensitive ? s : null }).then(function (r) {
          App.toast(id ? 'บันทึกแล้ว' : 'เพิ่มพนักงาน ' + r.id + ' แล้ว — ดูรหัสเข้าใช้งานครั้งแรกในแฟ้ม'); m.close(); load();
        }).catch(function () { btn.disabled = false; });
      };
    }).catch(function () {});
  }
  load();
} });
</script>
</body>
</html>
