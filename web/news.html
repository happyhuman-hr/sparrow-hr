<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข่าวสาร — The Sparrow HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;600;700&family=EB+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/sparrow-mark-wine.png">
<meta name="theme-color" content="#7a1c2b">
<link rel="stylesheet" href="css/app.css">
<style>
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chips button { border-radius: 99px; padding: 5px 12px; font-size: 13px; }
  .chips button.on { background: var(--wine); color: #fff; border-color: var(--wine); }
  .news { position: relative; }
  .news .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); margin-bottom: 6px; }
  .news h3 { font-size: 17px; color: var(--ink); margin: 0 0 8px; }
  .news .body { white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
  .news .body a { word-break: break-all; }
  .news.pinned { border-color: var(--wine); }
  .news.urgent { border-left: 5px solid var(--bad); }
  .news .new { position: absolute; top: 14px; right: 14px; }
  .cat { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--wine-soft); color: var(--wine); font-weight: 600; }
  .cat.urgent { background: var(--bad-soft); color: var(--bad); }
</style>
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
/* ข่าวสาร / ประกาศของร้าน — เจ้าของร้านและ HR เขียนในหน้าตั้งค่า · พนักงานเห็นเฉพาะข่าวที่ส่งถึงแผนกตัวเองหรือทุกคน */
App.boot({ page: 'news', ready: function (me) {
  var main = App.$('#main'), wrap = App.h('<div class="wrap narrow"></div>'); main.appendChild(wrap);
  var data, cat = 'all';
  var seen = (function () { try { return JSON.parse(localStorage.getItem('hris-news-read') || '[]'); } catch (e) { return []; } })();

  function linkify(text) {
    return App.esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function load() { App.loading(wrap); App.call('news').then(function (d) { data = d; render(); markRead(); }).catch(function () {}); }
  function markRead() {
    var ids = data.items.map(function (n) { return n.id + (n.updatedAt || ''); });
    try { localStorage.setItem('hris-news-read', JSON.stringify(seen.concat(ids).slice(-300))); } catch (e) { /* ignore */ }
  }
  function render() {
    var cats = {}; data.items.forEach(function (n) { cats[n.category] = 1; });
    var list = data.items.filter(function (n) { return cat === 'all' || n.category === cat; });
    wrap.innerHTML = '<div class="row" style="margin-bottom:12px"><div style="flex:1"><h1>ข่าวสาร</h1><div class="sub">ประกาศจาก The Sparrow</div></div>' +
      (App.can('hr') ? '<a class="btn sm accent" href="' + App.link('settings.html') + (App.link('settings.html').indexOf('?') > 0 ? '&' : '?') + 'compose=news#s-news">✎ เขียนข่าว</a>' : '') + '</div>' +
      (Object.keys(cats).length > 1 ? '<div class="chips"><button data-cat="all" class="' + (cat === 'all' ? 'on' : '') + '">ทั้งหมด</button>' +
        Object.keys(cats).map(function (k) { return '<button data-cat="' + k + '" class="' + (cat === k ? 'on' : '') + '">' + App.esc(data.categories[k] || k) + '</button>'; }).join('') + '</div>' : '') +
      (list.length ? list.map(function (n) {
        var isNew = seen.indexOf(n.id + (n.updatedAt || '')) < 0;
        return '<article class="card news' + (n.pinned === 'yes' ? ' pinned' : '') + (n.category === 'urgent' ? ' urgent' : '') + '" id="' + n.id + '">' +
          (isNew ? '<span class="badge b-late new">ใหม่</span>' : '') +
          '<div class="meta">' + (n.pinned === 'yes' ? '<span title="ปักหมุด">📌</span>' : '') + '<span class="cat' + (n.category === 'urgent' ? ' urgent' : '') + '">' + App.esc(n.categoryName) + '</span>' +
            '<span>' + App.dateTH(n.startDate || String(n.createdAt).slice(0, 10), { dow: true }) + '</span>' + (n.author ? '<span>· ' + App.esc(n.author) + '</span>' : '') +
            (n.audience && n.audience !== 'all' ? '<span>· ถึง ' + App.esc(n.audience) + '</span>' : '') + '</div>' +
          '<h3>' + App.esc(n.title) + '</h3><div class="body">' + linkify(n.body) + '</div>' +
          (n.endDate ? '<div class="sub" style="margin-top:8px">แสดงถึง ' + App.dateTH(n.endDate) + '</div>' : '') + '</article>';
      }).join('') : '<div class="card empty">ยังไม่มีข่าวสาร</div>');
    App.$$('[data-cat]', wrap).forEach(function (b) { b.onclick = function () { cat = b.getAttribute('data-cat'); render(); }; });
    if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ block: 'start' }); }
  }
  load();
} });
</script>
</body>
</html>
