<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สลิปเงินเดือน — The Sparrow HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;600;700&family=EB+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/sparrow-mark-wine.png">
<meta name="theme-color" content="#7a1c2b">
<link rel="stylesheet" href="css/app.css">
<style>
  .months { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
  .months button { flex: none; flex-direction: column; align-items: flex-start; gap: 0; min-width: 132px; padding: 8px 12px; border-radius: 12px; text-align: left; }
  .months button.on { border-color: var(--wine); background: var(--wine-soft); }
  .months button .m { font-weight: 700; }
  .months button .v { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .months button .new { font-size: 10.5px; color: #fff; background: var(--wine); border-radius: 99px; padding: 0 6px; margin-left: 4px; }
  .slipframe { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: #fff; min-height: 720px; box-shadow: var(--shadow); }
</style>
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script src="js/slip.js"></script>
<script>
/* สลิปเงินเดือนของฉัน — เห็นเฉพาะของตัวเอง และเฉพาะเดือนที่เจ้าของร้าน / HR กดส่งแล้ว */
App.boot({ page: 'payslip', ready: function (me) {
  var main = App.$('#main'), wrap = App.h('<div class="wrap" style="max-width:820px"></div>'); main.appendChild(wrap);
  var list = [], current = App.params.get('month');

  function load() {
    App.loading(wrap);
    App.call('mySlips').then(function (l) { list = l; if (!current && l.length) current = l[0].month; render(); }).catch(function () {});
  }
  function render() {
    wrap.innerHTML = '<div class="row" style="margin-bottom:10px"><div style="flex:1"><h1>สลิปเงินเดือน</h1><div class="sub">เห็นเฉพาะของคุณ · ข้อมูลเงินเดือนเป็นความลับตามข้อบังคับฯ ห้ามเปิดเผยให้ผู้อื่น</div></div></div>' +
      (list.length ? '<div class="months">' + list.map(function (x) {
        return '<button data-m="' + x.month + '" class="' + (x.month === current ? 'on' : '') + '"><span class="m">' + App.monthTH(x.month) + (x.seen ? '' : '<span class="new">ใหม่</span>') + '</span>' +
          '<span class="v">สุทธิ ฿' + (+x.net || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (x.ackAt ? ' · ✓' : '') + '</span></button>';
      }).join('') + '</div><div class="row" style="margin-bottom:10px"><span class="sub" id="pubAt"></span><div class="spacer"></div><span id="ackBox"></span><button class="sm" id="print">🖨 พิมพ์ / บันทึก PDF</button></div>' +
        '<iframe class="slipframe" id="slip" title="สลิปเงินเดือน"></iframe>'
      + '<p class="sub" style="margin-top:12px">📄 <a href="' + App.link('tax50.html') + '">หนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ) รายปี</a> — ใช้ยื่นภาษีประจำปี</p>'
      : '<div class="card empty">ยังไม่มีสลิปเงินเดือน<br><span class="sub">สลิปจะแสดงที่นี่เมื่อร้านส่งสลิปของเดือนนั้นแล้ว</span></div>');
    App.$$('[data-m]', wrap).forEach(function (b) { b.onclick = function () { current = b.getAttribute('data-m'); render(); }; });
    if (list.length) show();
  }
  function show() {
    var f = App.$('#slip');
    App.call('mySlip', { month: current }).then(function (d) {
      f.srcdoc = App.slipHtml(d.row, d.month, d.shopName, { note: 'ส่งเมื่อ ' + String(d.publishedAt).slice(0, 16) });
      f.onload = function () { try { f.style.height = (f.contentDocument.documentElement.scrollHeight + 20) + 'px'; } catch (e) { /* ignore */ } };
      App.$('#pubAt').textContent = 'ส่งเมื่อ ' + String(d.publishedAt).slice(0, 16);
      ackBox(d.ackAt);
      App.$('#print').onclick = function () { f.contentWindow.focus(); f.contentWindow.print(); };
      var it = list.filter(function (x) { return x.month === current; })[0]; if (it && !it.seen) { it.seen = true; var b = App.$('[data-m="' + current + '"] .new'); if (b) b.remove(); }
    }).catch(function () {});
  }
  function ackBox(at) {
    var box = App.$('#ackBox');
    if (at) { box.innerHTML = '<span class="badge b-present">✓ รับทราบแล้ว ' + App.esc(String(at).slice(0, 16)) + '</span>'; return; }
    box.innerHTML = '<button class="sm accent" id="ack">✓ รับทราบสลิป</button>';
    App.$('#ack').onclick = function () {
      if (!confirm('ยืนยันว่าได้ตรวจสอบและรับทราบสลิปเงินเดือน ' + App.monthTH(current) + ' แล้ว?')) return;
      this.disabled = true;
      App.call('slipAck', { month: current }).then(function (r) {
        ackBox(r.ackAt); App.toast('รับทราบสลิปแล้ว');
        var it = list.filter(function (x) { return x.month === current; })[0]; if (it) it.ackAt = r.ackAt;
        var mb = App.$('[data-m="' + current + '"] .v'); if (mb && mb.textContent.indexOf('✓') < 0) mb.textContent += ' · ✓';
      }).catch(function () {});
    };
  }
  load();
} });
</script>
</body>
</html>
